services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Crucial: Vite env vars are baked in at compile-time.
        # The browser runs on the host machine, so it must reach http://localhost:5000 (P11)
        VITE_API_URL: http://localhost:5000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_started
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MONGO_URI: mongodb://mongodb:27017/taskdb
      MONGODB_URI: mongodb://mongodb:27017/taskdb
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:-student-portfolio-lab-secret}
      CACHE_ENABLED: "true"
    ports:
      - "5000:5000"
    restart: on-failure
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-network

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      # Named volume guarantees task data persists across container down/up (P11)
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app-network

volumes:
  mongodb-data:

networks:
  app-network:
    driver: bridge
